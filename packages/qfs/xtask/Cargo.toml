[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "qfs build tooling (cargo-xtask pattern): gen-docs (anti-drift reference) + dist (release artifacts). NOT shipped in the binary."
# Build tooling — never published, never part of the shipped artifact (RFD §9).
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# The xtask reuses the BINARY's own doc generator (anti-drift): it links `qfs` (the lib facet)
# and calls `qfs::docs::gen_docs` / `check_docs`, which render from the live describe registry.
# This is a path dep already in the workspace — it adds ZERO external crates (dep-light), and
# `qfs` is already compiled, so linking it here is cheap.
qfs = { path = "../crates/qfs" }

[dev-dependencies]
# The cookbook verified-true ratchet lives here rather than in the binary crate: it needs BOTH the
# grammar (to read each recipe) and `qfs`'s compiled describe registry (to check the columns it
# names), and the binary's own dep guard (`crates/cmd/tests/dep_direction.rs`) pins it off the lower
# spine — a `qfs -> qfs-parser` edge, even dev-only, is a spine violation. xtask already links `qfs`
# for gen-docs and ships in nothing, so it is the anti-drift tooling's natural home.
qfs-parser = { path = "../crates/parser" }
qfs-core = { path = "../crates/core" }

[lints]
workspace = true
